<style>
:root{--paper:#FBFAF7;--card:#F1EEE8;--ink:#1A222B;--soft:#5B6672;--rule:#DDD8CF;--accent:#1F3A4D;--err:#B42318;color-scheme:light}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]){--paper:#11151A;--card:#182028;--ink:#E9E7E2;--soft:#A0A9B2;--rule:#2A343E;--accent:#2F5870;--err:#FF8A7A;color-scheme:dark}}
html[data-theme="dark"]{--paper:#11151A;--card:#182028;--ink:#E9E7E2;--soft:#A0A9B2;--rule:#2A343E;--accent:#2F5870;--err:#FF8A7A;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}
.lk{width:100%;max-width:380px;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:24px 20px}
.lk h1{margin:0 0 4px;font-size:21px}
.lk p{margin:0 0 14px;color:var(--soft);font-size:14px}
.lk input[type=password]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
.lk .rm{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.lk button{margin-top:14px;width:100%;font:inherit;font-weight:700;padding:11px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
.lk button:disabled{opacity:.6}
.lk .e{color:var(--err);font-size:14px;margin-top:10px;min-height:1.4em}
.ld{color:var(--soft);font-size:15px}
[hidden]{display:none!important}
</style>

<script>

(function () {
  var P = JSON.parse(document.getElementById('payload').textContent);
  var KEY = 'surg-key-' + P.s.slice(0, 10);
  var form = document.getElementById('lockForm'), err = document.getElementById('lockErr');
  var btn = document.getElementById('lockBtn'), ld = document.getElementById('lockLd');

  function unb64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function tob64(buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
  function getSaved() { try { return sessionStorage.getItem(KEY) || localStorage.getItem(KEY); } catch (e) { return null; } }
  function save(remember, v) { try { sessionStorage.setItem(KEY, v); if (remember) localStorage.setItem(KEY, v); } catch (e) {} }
  function forget() { try { sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); } catch (e) {} }
  function showForm(m) { ld.hidden = true; form.hidden = false; if (m) err.textContent = m; document.getElementById('lockPw').focus(); }

  async function decrypt(key) {
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(P.i) }, key, unb64(P.c));
    if (P.z) {
      var s = new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
      pt = await new Response(s).arrayBuffer();
    }
    return new TextDecoder().decode(pt);
  }
  function render(html) { document.open(); document.write(html); document.close(); }

  if (!window.crypto || !crypto.subtle) { showForm('此瀏覽器不支援解密，請用 https 網址開啟，或改用 Chrome／Safari。'); btn.disabled = true; return; }
  if (P.z && typeof DecompressionStream !== 'function') { showForm('瀏覽器版本過舊，請更新 Chrome／Safari 後再開啟。'); btn.disabled = true; return; }

  var saved = getSaved();
  if (saved) {
    crypto.subtle.importKey('raw', unb64(saved), 'AES-GCM', true, ['decrypt']).then(decrypt).then(render)
      .catch(function () { forget(); showForm(); });
  } else {
    showForm();
  }

  form.onsubmit = async function (e) {
    e.preventDefault();
    var pw = document.getElementById('lockPw').value, remember = document.getElementById('lockRm').checked;
    if (!pw) return;
    btn.disabled = true; btn.textContent = '解鎖中…'; err.textContent = '';
    var html, key;
    try {
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(P.s), iterations: P.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      html = await decrypt(key);
    } catch (x) {
      err.textContent = '密碼錯誤，請再試一次。'; btn.disabled = false; btn.textContent = '解鎖';
      return;
    }
    save(remember, tob64(await crypto.subtle.exportKey('raw', key)));
    render(html);
  };
})();

</script>
